<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SV — аксессуары для ПК и ноутбуков</title>
<!-- Русский комментарий: этот скрипт выбирает светлую или тёмную тему до загрузки страницы, чтобы не было «мигания». -->
<script>
  try { document.documentElement.dataset.theme = localStorage.getItem("sv_theme") || "dark"; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<!-- Стили сайта: style.css — основной дизайн, responsive.css — адаптация под телефоны и планшеты -->
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="no-promo">
 
<div class="cursor-glow" id="cursorGlow"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="progress" id="progress"></div>
 
<nav id="nav">
  <a href="#/" class="logo" data-go="top">SV</a>
  <div class="nav-links">
    <a href="#/" data-go="catalog">Каталог</a>
    <a href="#/" data-go="builder">Конструктор</a>
    <a href="#/" data-go="why">О магазине</a>
  </div>
  <div class="nav-actions">
    <button class="icon-btn" id="themeBtn" aria-label="Переключить тему">🌙</button>
    <a class="pill" href="#/account" id="accountBtn">Войти</a>
    <button class="pill" id="cartBtn">Корзина <span class="count" id="cartCount">0</span></button>
  </div>
</nav>
 
<main id="app"></main>
 
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Корзина</h3>
    <button class="close" id="closeCart" aria-label="Закрыть">×</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="drawer-foot">
    <div class="total"><span>Итого</span><span id="cartTotal">0 ₴</span></div>
    <a href="#/checkout" class="btn btn-block" id="drawerCheckout">Оформить заказ</a>
    <button class="btn btn-danger btn-block" id="clearCart">Очистить корзину</button>
  </div>
</aside>
 
<div class="toasts" id="toasts" aria-live="polite"></div>
 

<!-- Скрипты подключаются по порядку: каждый файл использует данные из предыдущих. Менять порядок нельзя. -->
<script src="js/products.js"></script>
<script src="js/utils.js"></script>
<script src="js/cart.js"></script>
<script src="js/builder.js"></script>
<script src="js/home.js"></script>
<script src="js/product.js"></script>
<script src="js/profile.js"></script>
<script src="js/checkout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
